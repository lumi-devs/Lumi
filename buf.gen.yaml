version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/protocolbuffers/googleapis
plugins:
  - remote: buf.build/connectrpc/es:v1.6.1
    out: apps/bot/src/rpc/gen
    opt: target=ts
  - remote: buf.build/protocolbuffers/es:v2.2.0
    out: apps/bot/src/rpc/gen
    opt: target=ts