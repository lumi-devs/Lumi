apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: lumi
  labels:
    app: scheduler
spec:
  # The scheduler lock makes extra replicas idle standbys; 1 is sufficient.
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/lumi-devs/lumi-scheduler:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/scheduler/src/main.ts"]
          env:
            - name: SCHEDULER_METRICS_PORT
              value: "9092"
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          ports:
            - name: metrics
              containerPort: 9092
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
      terminationGracePeriodSeconds: 60
