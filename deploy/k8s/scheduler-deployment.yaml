# BullMQ owner. Always 1 replica — `SCHEDULER_LEADER_LOCK=true` enforces
# single-active even during a rolling deploy. (BullMQ would serialise job
# execution via per-job locks regardless, but the leader lock keeps the
# scheduler's repeat-job evaluator + RabbitMQ task-fire consumer single-active.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: lumi
spec:
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate): we want the old pod's leader-lock to lapse
    # cleanly before the new one acquires, rather than two pods racing.
    type: Recreate
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: ghcr.io/your-org/lumi:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/scheduler/src/main.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: LUMI_ROLE
              value: "scheduler"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
