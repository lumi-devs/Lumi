apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: lumi
  labels:
    app: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/lumi-devs/lumi-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: DASHBOARD_HOST
              value: "0.0.0.0"
            - name: DASHBOARD_PORT
              value: "8080"
            - name: WORKER_RPC_URL
              value: "http://worker-0.worker-headless.lumi.svc.cluster.local:8000"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: lumi
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
