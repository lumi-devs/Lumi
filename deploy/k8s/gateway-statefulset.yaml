apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  namespace: lumi
spec:
  serviceName: gateway-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: ghcr.io/your-org/lumi:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/gateway/src/main.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: LUMI_ROLE
              value: "gateway"
            - name: LUMI_CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-headless
  namespace: lumi
spec:
  clusterIP: None
  selector:
    app: gateway
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
