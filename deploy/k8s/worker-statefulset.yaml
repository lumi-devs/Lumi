apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
  namespace: lumi
  labels:
    app: worker
spec:
  serviceName: worker-headless
  # Single replica until guild count justifies clustering. Scaling past 1
  # requires CLUSTER_NAME set (for shard telemetry namespacing) and SHARD_LIST
  # computed per replica (static assignment, not dynamic). See "Scaling to
  # ~1,000,000 guilds" in plan.md for how to size this at growth.
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take more than one shard-range offline at once - each replacement
      # pod RESUMEs its predecessor's sessions from Redis (session-store.ts).
      maxUnavailable: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/your-org/lumi:latest  # replace with your registry
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/worker/src/main.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: LUMI_ROLE
              value: "worker"
            - name: LUMI_CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          ports:
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: lumi-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: lumi-data
          persistentVolumeClaim:
            claimName: lumi-data
---
apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: lumi
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
