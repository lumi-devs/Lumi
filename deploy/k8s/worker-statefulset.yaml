apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
  namespace: lumi
  labels:
    app: worker
spec:
  serviceName: worker-headless
  # Single replica until guild count justifies clustering. Each pod runs a
  # discord.js ShardingManager that spawns one child process per shard it
  # owns (TOTAL_SHARDS/SHARD_LIST, default "auto" = all of them, one pod).
  # Scaling past 1 replica requires CLUSTER_NAME set (for shard telemetry
  # namespacing) and SHARD_LIST partitioned per replica (static assignment,
  # not dynamic) - see docs/architecture.md. There is no in-place rebalance
  # path; a shard-count change requires a restart.
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take more than one shard-range offline at once during a rolling
      # update. Each replacement pod does a fresh IDENTIFY (no session resume -
      # there is no session-store), so this just bounds how many shard ranges
      # are simultaneously disconnected, not how long the gap is.
      maxUnavailable: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/lumi-devs/lumi:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/worker/src/main.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: LUMI_CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          ports:
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: lumi-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: lumi-data
          persistentVolumeClaim:
            claimName: lumi-data
---
apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: lumi
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
