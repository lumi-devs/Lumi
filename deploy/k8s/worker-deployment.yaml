apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: lumi
  labels:
    app: worker
spec:
  selector:
    matchLabels:
      app: worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: ghcr.io/your-org/lumi:latest  # replace with your registry
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/worker/src/main.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: LUMI_ROLE
              value: "consumer"
            - name: LUMI_CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          ports:
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: lumi-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      volumes:
        - name: lumi-data
          persistentVolumeClaim:
            claimName: lumi-data
