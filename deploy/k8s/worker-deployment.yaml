# Stateless worker pool. KEDA owns `spec.replicas` via the ScaledObject —
# don't pin it here; KEDA will reconcile and warn.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ember
  labels:
    app: worker
spec:
  selector:
    matchLabels:
      app: worker
  # `replicas` intentionally omitted; KEDA manages it via HPA.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: worker
      annotations:
        # Surface /metrics to Prometheus scrape configs that honour these
        # annotations (kube-prometheus-stack PodMonitor variant works too).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: ghcr.io/your-org/ember:latest  # replace with your registry
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "bunx prisma migrate deploy && bun apps/worker/src/main.ts"]
          envFrom:
            - configMapRef:
                name: ember-env
            - secretRef:
                name: ember-secrets
          env:
            - name: EMBER_ROLE
              value: "worker"
            # Stable per-pod consumer id so XAUTOCLAIM can tell pods apart.
            - name: EMBER_CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Cap the V8 heap below the container memory limit so the OOM
            # killer fires after V8 has a chance to GC. 384 MiB heap inside a
            # 512 MiB pod leaves ~128 MiB for off-heap allocations + Bun/node.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              # SIGTERM triggers the drain orchestrator (markDraining → flip
              # /readyz → preCloseGraceMs → close consumers → flush XACKs).
              # The k8s preStop hook only needs to delay SIGTERM long enough
              # for endpoints to propagate; the app handles the rest.
              exec:
                command: ["sh", "-c", "sleep 5"]
