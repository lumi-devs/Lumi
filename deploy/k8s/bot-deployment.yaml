apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bot
  namespace: lumi
  labels:
    app: bot
spec:
  serviceName: bot-headless
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: bot
          image: ghcr.io/lumi-devs/lumi:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "src/index.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: LUMI_CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          ports:
            - name: rpc
              containerPort: 8091
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: lumi-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: lumi-data
          persistentVolumeClaim:
            claimName: lumi-data
---
apiVersion: v1
kind: Service
metadata:
  name: bot-headless
  namespace: lumi
spec:
  clusterIP: None
  selector:
    app: bot
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: bot
  namespace: lumi
spec:
  type: ClusterIP
  selector:
    app: bot
  ports:
    - name: rpc
      port: 8091
      targetPort: rpc
    - name: metrics
      port: 9090
      targetPort: metrics
