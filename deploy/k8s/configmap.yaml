apiVersion: v1
kind: ConfigMap
metadata:
  name: lumi-env
  namespace: lumi
data:
  TRANSPORT: "streams"
  REDIS_HOST: "redis.lumi.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_CACHE_DB: "0"

  POSTGRES_URL: "postgresql://lumi@pgbouncer.lumi.svc.cluster.local:6432/lumi"
  DIRECT_POSTGRES_URL: "postgresql://lumi@postgres.lumi.svc.cluster.local:5432/lumi"
  POSTGRES_POOL_MAX: "10"

  RABBITMQ_URL: "amqp://lumi@rabbitmq.lumi.svc.cluster.local:5672"
  RABBITMQ_ENABLED: "true"

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
  OTEL_TRACES_SAMPLE_RATIO: "0.1"

  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"

  LOG_FORMAT: "json"
  LOG_LEVEL: "info"

  DISCORD_PROXY_URL: "http://nirn-proxy.lumi.svc.cluster.local:8080"

  CLUSTER_NAME: "lumi-prod"

  INTERACTION_DEFER_AT_GATEWAY: "true"

  SCHEDULER_LEADER_LOCK: "true"
