apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lumi
  labels:
    app: api
spec:
  # Stateless - no Discord gateway connection, no BullMQ scheduling (see
  # apps/api/src/main.ts). Safe to run more than one replica for HA; unlike
  # `worker` this isn't a StatefulSet because there's no per-pod shard identity.
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/lumi-devs/lumi-api:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/api/src/main.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          ports:
            - name: rpc
              containerPort: 8091
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lumi
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: rpc
      port: 8091
      targetPort: rpc
    - name: metrics
      port: 9090
      targetPort: metrics
