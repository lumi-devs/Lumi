# Dashboard RPC consumer. Stateless (RabbitMQ does the work-balancing).
# Two replicas for availability; no autoscaler — dashboard load is bursty but
# small, and RPC handlers are short-lived.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lumi
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/your-org/lumi:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "apps/api/src/main.ts"]
          envFrom:
            - configMapRef:
                name: lumi-env
            - secretRef:
                name: lumi-secrets
          env:
            - name: LUMI_ROLE
              # apps/api currently imports @lumi/worker/main; keep it in the
              # worker role until the real API split lands.
              value: "worker"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
          ports:
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: lumi-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
      volumes:
        - name: lumi-data
          persistentVolumeClaim:
            claimName: lumi-data
