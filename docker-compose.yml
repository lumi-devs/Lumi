x-lumi-image: &lumi-image
  image: ghcr.io/lumi-devs/lumi:${LUMI_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: lumi-postgres
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lumi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/redis:8-alpine
    container_name: lumi-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    <<: *lumi-image
    container_name: lumi-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      OWNER_IDS: ${OWNER_IDS}
      DATABASE_URL: postgresql://lumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lumi
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-lumi}
      DEFAULT_PREFIX: "${DEFAULT_PREFIX:-,}"
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_USERNAME: ${GIT_USERNAME:-x-access-token}
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: "true"
      METRICS_PORT: "9090"
      RPC_HTTP_HOST: 0.0.0.0
      RPC_HTTP_PORT: "8091"
      RPC_INTERNAL_TOKEN: ${RPC_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:9090:9090"

  migrate:
    <<: *lumi-image
    profiles: ["migrate"]
    container_name: lumi-migrate
    command: ["run", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://lumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lumi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
