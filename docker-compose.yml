x-lumi-image: &lumi-image
  image: ghcr.io/lumi-devs/lumi:${LUMI_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile

x-dashboard-image: &dashboard-image
  image: ghcr.io/lumi-devs/lumi-dashboard:${LUMI_TAG:-latest}
  build:
    context: .
    dockerfile: apps/dashboard/Dockerfile

x-hardening: &hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:exec,size=256M

services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: lumi-postgres
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lumi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *hardening
    read_only: false
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:exec,size=64M
      - /var/run/postgresql:exec,size=16M

  redis:
    image: docker.io/redis:8-alpine
    container_name: lumi-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *hardening
    read_only: false
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:exec,size=64M

  migrate:
    <<: [*lumi-image, *hardening]
    container_name: lumi-migrate
    command: ["run", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://lumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lumi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: false

  bot:
    <<: [*lumi-image, *hardening]
    container_name: lumi-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      OWNER_IDS: ${OWNER_IDS}
      DATABASE_URL: postgresql://lumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lumi
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-lumi}
      DEFAULT_PREFIX: "${DEFAULT_PREFIX:-,}"
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_USERNAME: ${GIT_USERNAME:-x-access-token}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: "true"
      METRICS_PORT: "9090"
      RPC_HTTP_HOST: 0.0.0.0
      RPC_HTTP_PORT: "8091"
      RPC_INTERNAL_TOKEN: ${RPC_INTERNAL_TOKEN:?set RPC_INTERNAL_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:9090:9090"
    tmpfs:
      - /tmp:exec,size=256M
    volumes:
      - lumi_data:/app/data

  dashboard:
    <<: [*dashboard-image, *hardening]
    container_name: lumi-dashboard
    environment:
      RPC_URL: http://bot:8091
      RPC_INTERNAL_TOKEN: ${RPC_INTERNAL_TOKEN:?set RPC_INTERNAL_TOKEN in .env}
      ORIGIN: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-${WEB_BASE_URL}/auth/callback}
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      DATABASE_URL: postgresql://lumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lumi
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-2592000}
      DASHBOARD_INSECURE_COOKIES: ${DASHBOARD_INSECURE_COOKIES:-0}
      OWNER_IDS: ${OWNER_IDS}
      NODE_ENV: production
      PORT: "4173"
    depends_on:
      bot:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4173/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:4173:4173"
    tmpfs:
      - /tmp:exec,size=256M

volumes:
  postgres_data:
  redis_data:
  lumi_data:
