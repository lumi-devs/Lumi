networks:
  lumi-net:
    driver: bridge
  # Grafana proxies datasource queries on behalf of its users, which makes any
  # service it can route to reachable from the browser. Keeping it off lumi-net
  # is what stops that proxy from being pointed at the api process's internal
  # RPC port; it reaches Prometheus/Tempo over this network instead, and they
  # are the only services attached to both.
  lumi-obs-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  backup-data:

x-lumi-service: &lumi-service
  image: ghcr.io/lumi-devs/lumi:latest
  build:
    context: .
    dockerfile: Dockerfile
    target: worker
  env_file:
    - path: .env
      required: false
  environment: &lumi-env
    REDIS_HOST: redis
    # Points straight at postgres by default (single-node tier, no pooler).
    # Production/cluster tiers enable the `pgbouncer` profile and set this to
    # postgresql://...@pgbouncer:6432/lumi in .env - see deploy/docker/README.md.
    POSTGRES_URL: "${POSTGRES_URL:-postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres:5432/lumi}"
    DIRECT_POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres/lumi
    OTEL_ENABLED: "${OTEL_ENABLED:-true}"
    OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
    OTEL_TRACES_SAMPLE_RATIO: "${OTEL_TRACES_SAMPLE_RATIO:-1}"
    METRICS_ENABLED: "${METRICS_ENABLED:-true}"
    METRICS_PORT: "9090"
    LOG_FORMAT: "${LOG_FORMAT:-json}"
    LOG_LEVEL: "${LOG_LEVEL:-info}"
    NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=384}"
    DISCORD_PROXY_URL: "${DISCORD_PROXY_URL:-}"
    LUMI_DEV_PATHS: "${LUMI_DEV_PATHS:-/lumi-addons}"
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
      required: false
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - lumi-net
  deploy:
    resources:
      limits:
        memory: 512m
        cpus: '1.0'
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # One-shot: applies pending Prisma migrations, then exits. worker/worker-scale/api
  # wait on `service_completed_successfully` instead of each running migrate deploy
  # on their own startup (that raced on every scaled replica before this). Reuses the
  # worker image/build (same tag, same `target: worker`) rather than a separate image -
  # a distinct `migrate` tag would race the worker image for ownership of the same name
  # on `compose build`, and pull-based users (CI only publishes worker/api/scheduler
  # images) would get the worker image with no command override, i.e. it never exits.
  migrate:
    <<: *lumi-service
    container_name: lumi-migrate
    command: ["bunx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *lumi-service
    container_name: lumi-worker
    environment:
      <<: *lumi-env
      METRICS_HOST: "0.0.0.0"

  lumi-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: lumi-dev
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_HOST: redis
      POSTGRES_URL: "${POSTGRES_URL:-postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres:5432/lumi}"
      DIRECT_POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres/lumi
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_TRACES_SAMPLE_RATIO: "${OTEL_TRACES_SAMPLE_RATIO:-1}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      METRICS_PORT: "9090"
      LOG_FORMAT: "${LOG_FORMAT:-pretty}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app:z
      - ../lumi-addons:/lumi-addons:z
    networks:
      - lumi-net
    stdin_open: true
    tty: true
    profiles:
      - development

  worker-scale:
    <<: *lumi-service
    container_name: lumi-worker-scale
    environment:
      <<: *lumi-env
      LUMI_CONSUMER_ID: "${LUMI_CONSUMER_ID:-worker-1}"
      METRICS_HOST: "0.0.0.0"
      # Extra replicas mean extra DB connections - route through the pooler
      # that the `scale` profile also starts, rather than the single-node
      # POSTGRES_URL default.
      POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@pgbouncer:6432/lumi
    profiles:
      - scale

  api:
    <<: *lumi-service
    container_name: lumi-api
    image: ghcr.io/lumi-devs/lumi-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *lumi-env
      # Serves the dashboard's RPC client from another container, so it has to
      # bind beyond loopback. Authentication is RPC_INTERNAL_TOKEN, not the
      # network boundary.
      RPC_HTTP_HOST: "0.0.0.0"
      RPC_HTTP_PORT: "8091"
      # Shared secret authenticating the dashboard -> api RPC calls. Unset is
      # a hard failure rather than an insecure default: `actorId` in an RPC body
      # is unsigned, so anything that can reach port 8091 without this token can
      # claim to be the bot owner. Generate with `openssl rand -hex 32`.
      RPC_INTERNAL_TOKEN: "${RPC_INTERNAL_TOKEN:?set RPC_INTERNAL_TOKEN in .env - generate with: openssl rand -hex 32}"
      METRICS_HOST: "0.0.0.0"
    # Not published to the host - reachable only from other containers on
    # lumi-net (the dashboard's internal RPC client).
    expose:
      - "8091"

  scheduler:
    <<: *lumi-service
    container_name: lumi-scheduler
    image: ghcr.io/lumi-devs/lumi-scheduler:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    environment:
      <<: *lumi-env
      METRICS_HOST: "0.0.0.0"

  dashboard:
    image: ghcr.io/lumi-devs/lumi-dashboard:${LUMI_DASHBOARD_TAG:-latest}
    container_name: lumi-dashboard
    environment:
      <<: *lumi-env
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      # Doubles as NextAuth's session JWT encryption secret — see
      # src/lib/env.ts in the lumi-dashboard repo.
      DASHBOARD_SESSION_SECRET: "${DASHBOARD_SESSION_SECRET:?set DASHBOARD_SESSION_SECRET in .env - generate with: openssl rand -hex 32}"
      # Internal-only HTTP RPC bridge to the api process (see
      # packages/core/src/lib/rpc/http-server.ts) - reachable over lumi-net,
      # never published to the host.
      RPC_HTTP_URL: "http://api:8091"
      # No BOT_OWNERS here: the dashboard reads no such variable. Bot-owner
      # detection goes through the `auth.whoami` RPC, which defers to the
      # worker's PermitResolver.isBotOwner (OWNER_IDS, or the Discord
      # application's actual owner). Setting it here would be a silent no-op.
      DISCORD_OAUTH2_CLIENT_ID: "${DISCORD_OAUTH2_CLIENT_ID:-}"
      DISCORD_OAUTH2_CLIENT_SECRET: "${DISCORD_OAUTH2_CLIENT_SECRET:-}"
    depends_on:
      api:
        condition: service_started
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    profiles:
      - dashboard

  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: lumi-postgres
    environment:
      POSTGRES_DB: lumi
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumi}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:5432:5432"

  backup:
    image: docker.io/library/postgres:18-alpine
    container_name: lumi-backup
    entrypoint: []
    command: ["/scripts/backup.sh", "loop"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lumi
      POSTGRES_USER: ${POSTGRES_USER:-lumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumi}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: "${BACKUP_RETENTION:-7}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
    volumes:
      - ./deploy/backup/backup.sh:/scripts/backup.sh:ro
      - ./deploy/backup/restore-test.sh:/scripts/restore-test.sh:ro
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lumi-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    # Opt-in: talks straight to postgres (not pgbouncer - pg_dump/pg_restore
    # need a direct, non-pooled connection). Default command loops on
    # BACKUP_INTERVAL_HOURS. Run a one-off dump with
    # `docker compose --profile backup run --rm backup /scripts/backup.sh once`,
    # or verify the latest dump restores cleanly with
    # `docker compose --profile backup run --rm backup /scripts/restore-test.sh`
    # - see deploy/docker/README.md#-backups--restore-testing.
    profiles:
      - backup

  pgbouncer:
    image: docker.io/edoburu/pgbouncer:latest
    container_name: lumi-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumi
      DB_USER: ${POSTGRES_USER:-lumi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lumi}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-lumi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
    ports:
      - "127.0.0.1:6432:6432"
    # Opt-in: single-node tier talks to postgres directly. Enabling this
    # profile only starts the pooler - point POSTGRES_URL at pgbouncer:6432
    # in .env to actually use it (see deploy/docker/README.md).
    profiles:
      - pgbouncer
      - scale

  redis:
    image: docker.io/library/redis:8.8-alpine
    container_name: lumi-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-lumi}
    volumes:
      - redis-data:/data
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lumi}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160m
    ports:
      - "127.0.0.1:6379:6379"

  nirn-proxy:
    image: ghcr.io/germanoeich/nirn-proxy:latest
    container_name: lumi-nirn-proxy
    environment:
      LOG_LEVEL: "${NIRN_LOG_LEVEL:-info}"
      PORT: "8080"
      METRICS_PORT: "9000"
      BIND_IP: "0.0.0.0"
      REQUEST_TIMEOUT: "10000"
      BUFFER_SIZE: "200"
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nirn/v1/buckets > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    profiles:
      - scale

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.159.0
    container_name: lumi-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:4318:4318"

  tempo:
    image: docker.io/grafana/tempo:2.10.0
    container_name: lumi-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      # lumi-net for otel-collector's OTLP push, lumi-obs-net for Grafana's queries.
      - lumi-net
      - lumi-obs-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 512m

  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    container_name: lumi-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      # lumi-net to scrape the app services, lumi-obs-net for Grafana's queries.
      - lumi-net
      - lumi-obs-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: docker.io/grafana/grafana:13.2.1
    container_name: lumi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      # No default. Grafana's admin can add datasources and proxy requests
      # through the server, so `admin`/`admin` is a foothold, not a
      # convenience. Generate with `openssl rand -base64 24`.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env - generate with openssl rand -base64 24}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    # Deliberately NOT on lumi-net: Grafana's datasource proxy is a
    # server-side request primitive reachable by any logged-in Grafana user,
    # and lumi-net is where the worker's internal RPC port lives.
    networks:
      - lumi-obs-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:3001:3000"
