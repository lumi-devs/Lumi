networks:
  lumi-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  nats-data:
  # Holds downloaded 3rd-party modules: git clones (data/3rd-party-modules/) and
  # the symlinks ModuleStore discovers (data/installed-modules/). Without this,
  # a container recreate wipes every installed addon while Postgres still lists
  # them — leaving the bot with DB records but no files ("piece does not exist").
  lumi-data:

# Shared config for the four deployable services. They all run from the same
# image; each sets its own `command:`. NOTE: gateway/scheduler/api currently boot
# the full worker (apps/*/src/main.ts → import "@lumi/worker/main"), so only
# `worker` should run with the live bot token until the real service split. The
# other three are scaffolding kept under the `scale` profile.
x-lumi-service: &lumi-service
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  env_file: .env
  environment: &lumi-env
    REDIS_HOST: redis
    POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@pgbouncer:6432/lumi
    # Migrations bypass PgBouncer (transaction pooling can't hold DDL/advisory locks).
    DIRECT_POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres/lumi
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-lumi}:${RABBITMQ_PASSWORD:-lumi}@rabbitmq:5672
    RABBITMQ_ENABLED: "true"
    SENTRY_ENABLED: "${SENTRY_ENABLED:-false}"
    SENTRY_DSN: "${SENTRY_DSN:-}"
    # Telemetry: production services emit OTLP + expose /metrics on :9090.
    OTEL_ENABLED: "${OTEL_ENABLED:-true}"
    OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
    OTEL_TRACES_SAMPLE_RATIO: "${OTEL_TRACES_SAMPLE_RATIO:-1}"
    METRICS_ENABLED: "${METRICS_ENABLED:-true}"
    METRICS_PORT: "9090"
    LOG_FORMAT: "${LOG_FORMAT:-json}"
    LOG_LEVEL: "${LOG_LEVEL:-info}"
    # Per-service V8 heap cap. Worker default is 384 MiB (≈75% of the 512 MiB
    # container limit below); gateway/api override this in their own blocks.
    NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=384}"
    # Route all outbound discord.js REST through the shared nirn-proxy so
    # one global + per-route bucket budget is shared across every worker
    # replica. Defaults to empty (talk to discord.com directly); the scale
    # profile services below opt in by pointing at the `nirn-proxy` container.
    DISCORD_PROXY_URL: "${DISCORD_PROXY_URL:-}"
  depends_on:
    pgbouncer:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  # Persist downloaded modules across container recreation (see `lumi-data` note).
  volumes:
    - lumi-data:/app/data
  restart: unless-stopped
  networks:
    - lumi-net
  deploy:
    resources:
      limits:
        memory: 512m
        cpus: '1.0'
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  lumi-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: lumi-dev
    env_file: .env
    environment:
      REDIS_HOST: redis
      POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@pgbouncer:6432/lumi
      # Migrations bypass PgBouncer (transaction pooling can't hold DDL/advisory locks).
      DIRECT_POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres/lumi
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lumi}:${RABBITMQ_PASSWORD:-lumi}@rabbitmq:5672
      RABBITMQ_ENABLED: "true"
      SENTRY_ENABLED: "${SENTRY_ENABLED:-false}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      # Telemetry: apps always expose /metrics and emit OTLP traces. The OTLP
      # endpoint only resolves when the `observability` profile is up; the batch
      # exporter degrades quietly when the collector is absent.
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_TRACES_SAMPLE_RATIO: "${OTEL_TRACES_SAMPLE_RATIO:-1}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      METRICS_PORT: "9090"
      LOG_FORMAT: "${LOG_FORMAT:-pretty}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app:z
      - /app/node_modules
    networks:
      - lumi-net
    stdin_open: true
    tty: true
    profiles:
      - development

  worker:
    <<: *lumi-service
    container_name: lumi-worker
    command: ["sh", "-c", "bunx prisma migrate deploy && bun apps/worker/src/main.ts"]
    environment:
      <<: *lumi-env
      # Default (no-profile) service: the single-instance monolith bot. A bare
      # `docker compose up` brings it online (holds its own Discord WS) — this is
      # the self-hoster's "one command → working bot" path.
      # The `scale` profile instead runs `worker-scale` (LUMI_ROLE=worker, no WS,
      # consumes raw gateway packets from the bus) — see below.
      LUMI_ROLE: "${LUMI_ROLE:-monolith}"

  # Scale-profile services. When `docker compose --profile scale up` is used,
  # split topology comes online: gateway owns the WS, worker drops its WS and
  # consumes raw packets from the bus.
  worker-scale:
    <<: *lumi-service
    container_name: lumi-worker-scale
    command: ["sh", "-c", "bunx prisma migrate deploy && bun apps/worker/src/main.ts"]
    environment:
      <<: *lumi-env
      LUMI_ROLE: "worker"
      TRANSPORT: "streams"
      LUMI_CONSUMER_ID: "${LUMI_CONSUMER_ID:-worker-1}"
      INTERACTION_DEFER_AT_GATEWAY: "${INTERACTION_DEFER_AT_GATEWAY:-true}"
      DISCORD_PROXY_URL: "${DISCORD_PROXY_URL:-http://nirn-proxy:8080}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nirn-proxy:
        condition: service_started
    profiles:
      - scale

  gateway:
    <<: *lumi-service
    container_name: lumi-gateway
    command: ["bun", "apps/gateway/src/main.ts"]
    environment:
      <<: *lumi-env
      LUMI_ROLE: "gateway"
      TRANSPORT: "streams"
      INTERACTION_DEFER_AT_GATEWAY: "${INTERACTION_DEFER_AT_GATEWAY:-true}"
      DISCORD_PROXY_URL: "${DISCORD_PROXY_URL:-http://nirn-proxy:8080}"
      # Gateway holds the Discord cache (≈25 KB/guild); raise heap above the
      # 384 MiB worker default. See capacity-planning.md §7.
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      worker-scale:
        condition: service_started
      nirn-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: '2.0'
    profiles:
      - scale

  scheduler:
    <<: *lumi-service
    container_name: lumi-scheduler
    command: ["bun", "apps/scheduler/src/main.ts"]
    environment:
      <<: *lumi-env
      LUMI_ROLE: "scheduler"
      TRANSPORT: "streams"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - scale

  api:
    <<: *lumi-service
    container_name: lumi-api
    command: ["bun", "apps/api/src/main.ts"]
    environment:
      <<: *lumi-env
      # api re-imports @lumi/worker/main; run it in the worker role so it has no
      # Discord WS. Without this it defaults to `monolith` and opens a second
      # gateway session with the bot token, conflicting with the worker.
      LUMI_ROLE: "worker"
      # api is a thin RPC handler; smaller heap budget than the worker.
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      worker-scale:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    profiles:
      - scale

  postgres:
    image: postgres:17
    container_name: lumi-postgres
    environment:
      POSTGRES_DB: lumi
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumi}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: lumi-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumi
      DB_USER: ${POSTGRES_USER:-lumi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lumi}
      # Listen on 6432 to match the healthcheck, port map, and POSTGRES_URL.
      LISTEN_PORT: "6432"
      # Transaction pooling: a server backend is held only for the duration of a
      # transaction, so many short-lived client connections share few real
      # Postgres backends. Required for the stateless-worker fan-out.
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      # Total client slots PgBouncer accepts across all workers.
      MAX_CLIENT_CONN: "1000"
      # Real Postgres backends per (user, db) — the actual cap on Postgres.
      DEFAULT_POOL_SIZE: "20"
      # Transaction pooling cannot keep session-level prepared statements.
      MAX_PREPARED_STATEMENTS: "0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-lumi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
    ports:
      - "127.0.0.1:6432:6432"

  redis:
    image: redis:7.4-alpine
    container_name: lumi-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-lumi}
    volumes:
      - redis-data:/data
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lumi}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160m
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: lumi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lumi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lumi}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/advanced.config:/etc/rabbitmq/advanced.config:ro
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  # Shared outbound REST proxy. nirn-proxy presents a Discord-API-compatible
  # surface at :8080 and globally serialises buckets + the 50/s global limit
  # across every connected worker so 1000s of stateless workers can't trigger a
  # CloudFlare ban. Each worker still sends its own Authorization header; the
  # proxy keys buckets by (token, route). Lean default (in-memory, no clustering)
  # — flip to `REDIS_URL` if you run multiple nirn-proxy instances behind an LB.
  # Only spun up under the `scale` profile; single-host monolith hits Discord
  # directly (DISCORD_PROXY_URL stays empty).
  nirn-proxy:
    image: ghcr.io/germanoeich/nirn-proxy:latest
    container_name: lumi-nirn-proxy
    environment:
      LOG_LEVEL: "${NIRN_LOG_LEVEL:-info}"
      PORT: "8080"
      METRICS_PORT: "9000"
      # Global per-token RPS cap (Discord allows 50/s; nirn enforces ~95% by
      # default to leave headroom for clock skew between bot processes).
      BIND_IP: "0.0.0.0"
      REQUEST_TIMEOUT: "10000"
      BUFFER_SIZE: "200"
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      # nirn-proxy doesn't expose /healthz; a successful TCP connect on :8080 is
      # the documented liveness probe.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nirn/v1/buckets > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      # Bound to localhost for the loadtest script + prom scrape from the host.
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    profiles:
      - scale

#   dashboard:
