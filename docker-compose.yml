networks:
  lumi-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  tempo-data:

x-lumi-service: &lumi-service
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  env_file:
    - path: .env
      required: false
  environment: &lumi-env
    REDIS_HOST: redis
    POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@pgbouncer:6432/lumi
    DIRECT_POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres/lumi
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-lumi}:${RABBITMQ_PASSWORD:-lumi}@rabbitmq:5672
    RABBITMQ_ENABLED: "true"
    OTEL_ENABLED: "${OTEL_ENABLED:-true}"
    OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
    OTEL_TRACES_SAMPLE_RATIO: "${OTEL_TRACES_SAMPLE_RATIO:-1}"
    METRICS_ENABLED: "${METRICS_ENABLED:-true}"
    METRICS_PORT: "9090"
    LOG_FORMAT: "${LOG_FORMAT:-json}"
    LOG_LEVEL: "${LOG_LEVEL:-info}"
    NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=384}"
    DISCORD_PROXY_URL: "${DISCORD_PROXY_URL:-}"
    LUMI_DEV_PATHS: "${LUMI_DEV_PATHS:-/lumi-addons}"
  depends_on:
    pgbouncer:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - lumi-net
  deploy:
    resources:
      limits:
        memory: 512m
        cpus: '1.0'
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  lumi-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: lumi-dev
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_HOST: redis
      POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@pgbouncer:6432/lumi
      DIRECT_POSTGRES_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi}@postgres/lumi
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lumi}:${RABBITMQ_PASSWORD:-lumi}@rabbitmq:5672
      RABBITMQ_ENABLED: "true"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_TRACES_SAMPLE_RATIO: "${OTEL_TRACES_SAMPLE_RATIO:-1}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      METRICS_PORT: "9090"
      LOG_FORMAT: "${LOG_FORMAT:-pretty}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app:z
      - ../lumi-addons:/lumi-addons:z
    networks:
      - lumi-net
    stdin_open: true
    tty: true
    profiles:
      - development

  worker:
    <<: *lumi-service
    container_name: lumi-worker
    command: ["sh", "-c", "bunx prisma db push --accept-data-loss && bun apps/worker/src/main.ts"]
    environment:
      <<: *lumi-env
      LUMI_ROLE: "${LUMI_ROLE:-monolith}"
    volumes:
      - .:/app:z
      - ../lumi-addons:/lumi-addons:z

  worker-scale:
    <<: *lumi-service
    container_name: lumi-worker-scale
    command: ["sh", "-c", "bunx prisma db push --accept-data-loss && bun apps/worker/src/main.ts"]
    environment:
      <<: *lumi-env
      LUMI_ROLE: "worker"
      TRANSPORT: "streams"
      LUMI_CONSUMER_ID: "${LUMI_CONSUMER_ID:-worker-1}"
      INTERACTION_DEFER_AT_GATEWAY: "${INTERACTION_DEFER_AT_GATEWAY:-true}"
      DISCORD_PROXY_URL: "${DISCORD_PROXY_URL:-http://nirn-proxy:8080}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nirn-proxy:
        condition: service_started
    profiles:
      - scale

  gateway:
    <<: *lumi-service
    container_name: lumi-gateway
    command: ["bun", "apps/gateway/src/main.ts"]
    environment:
      <<: *lumi-env
      LUMI_ROLE: "gateway"
      TRANSPORT: "streams"
      INTERACTION_DEFER_AT_GATEWAY: "${INTERACTION_DEFER_AT_GATEWAY:-true}"
      DISCORD_PROXY_URL: "${DISCORD_PROXY_URL:-http://nirn-proxy:8080}"
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      worker-scale:
        condition: service_started
      nirn-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: '2.0'
    profiles:
      - scale

  scheduler:
    <<: *lumi-service
    container_name: lumi-scheduler
    command: ["bun", "apps/scheduler/src/main.ts"]
    environment:
      <<: *lumi-env
      LUMI_ROLE: "scheduler"
      TRANSPORT: "streams"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - scale

  dashboard:
    <<: *lumi-service
    container_name: lumi-dashboard
    command: ["bun", "apps/dashboard/src/main.ts"]
    environment:
      <<: *lumi-env
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      DASHBOARD_SESSION_SECRET: "${DASHBOARD_SESSION_SECRET:-}"
      DASHBOARD_SECURE_COOKIES: "${DASHBOARD_SECURE_COOKIES:-false}"
      DISCORD_OAUTH2_CLIENT_ID: "${DISCORD_OAUTH2_CLIENT_ID:-}"
      DISCORD_OAUTH2_CLIENT_SECRET: "${DISCORD_OAUTH2_CLIENT_SECRET:-}"
      DISCORD_OAUTH2_REDIRECT_URI: "${DISCORD_OAUTH2_REDIRECT_URI:-}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    profiles:
      - dashboard

  postgres:
    image: postgres:17
    container_name: lumi-postgres
    environment:
      POSTGRES_DB: lumi
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumi}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: lumi-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumi
      DB_USER: ${POSTGRES_USER:-lumi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lumi}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-lumi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
    ports:
      - "127.0.0.1:6432:6432"

  redis:
    image: redis:7-alpine
    container_name: lumi-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-lumi}
    volumes:
      - redis-data:/data
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lumi}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160m
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: lumi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lumi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lumi}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/advanced.config:/etc/rabbitmq/advanced.config:ro
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  nirn-proxy:
    image: ghcr.io/germanoeich/nirn-proxy:latest
    container_name: lumi-nirn-proxy
    environment:
      LOG_LEVEL: "${NIRN_LOG_LEVEL:-info}"
      PORT: "8080"
      METRICS_PORT: "9000"
      BIND_IP: "0.0.0.0"
      REQUEST_TIMEOUT: "10000"
      BUFFER_SIZE: "200"
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nirn/v1/buckets > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    profiles:
      - scale

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: lumi-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:4318:4318"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: lumi-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 512m

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: lumi-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lumi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:3001:3000"
