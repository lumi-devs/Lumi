  # NATS JetStream — the high-throughput alternative to Redis Streams.
  # Opt-in: only under `--profile scale-nats`, since Redis Streams is the
  # documented default for the scale profile (NATS is overkill until >20k evt/s).
  # JetStream stores its state on disk; the volume survives container restarts.
  nats:
    image: nats:2.10-alpine
    container_name: lumi-nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - nats-data:/data
    networks:
      - lumi-net
    restart: unless-stopped
    healthcheck:
      # The monitoring port serves /healthz; lean-and-supported.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:14222:4222"
      - "127.0.0.1:18222:8222"
    profiles:
      - scale-nats

  # ── Observability stack (LGTM-ish) ──────────────────────────────────────────
  # Opt-in: `docker compose --profile observability up`. A plain `up` stays lean.
  # Pipeline: apps → OTLP → otel-collector → Tempo (traces) ; Prometheus scrapes
  # app /metrics ; Grafana provisions datasources + dashboards + alert rules.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: lumi-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:4318:4318"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: lumi-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 512m

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: lumi-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lumi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - lumi-net
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "127.0.0.1:3001:3000"
