version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    labels:
      - "area:deps"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    labels:
      - "area:ci"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
