name: Setup Bun workspace
description: setup-bun + cached `bun install` (+ optional db:generate and Turbo cache). Run after actions/checkout.

inputs:
  install:
    description: Run `bun install --frozen-lockfile`.
    default: "true"
  db-generate:
    description: Run `bun run db:generate` after install.
    default: "false"
  turbo-scope:
    description: Turbo task scope for the .turbo cache (empty skips it).
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - name: Cache Bun dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
    - name: Generate Prisma client
      if: inputs.db-generate == 'true'
      shell: bash
      run: bun run db:generate
    - name: Cache Turborepo
      if: inputs.turbo-scope != ''
      uses: actions/cache@v6
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.turbo-scope }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.turbo-scope }}-
          ${{ runner.os }}-turbo-
