# Configuration for actions/labeler@v7
# Syntax: label → list of match objects → changed-files at same indent as list item

'pkg:core':
- changed-files:
  - any-glob-to-any-file: 'packages/core/**'

'pkg:event-bus':
- changed-files:
  - any-glob-to-any-file: 'packages/event-bus/**'

'pkg:sharding':
- changed-files:
  - any-glob-to-any-file: 'packages/sharding/**'

'pkg:observability':
- changed-files:
  - any-glob-to-any-file: 'packages/observability/**'

'pkg:contracts':
- changed-files:
  - any-glob-to-any-file: 'packages/contracts/**'

'pkg:sdk':
- changed-files:
  - any-glob-to-any-file: 'packages/sdk/**'

'app:dashboard':
- changed-files:
  - any-glob-to-any-file: 'apps/dashboard/**'

'app:gateway':
- changed-files:
  - any-glob-to-any-file: 'apps/gateway/**'

'app:worker':
- changed-files:
  - any-glob-to-any-file: 'apps/worker/**'

'app:scheduler':
- changed-files:
  - any-glob-to-any-file: 'apps/scheduler/**'

'area:i18n':
- changed-files:
  - any-glob-to-any-file:
    - 'packages/core/src/languages/**'
    - 'crowdin.yml'

'area:ci':
- changed-files:
  - any-glob-to-any-file: '.github/**'

'area:docs':
- changed-files:
  - any-glob-to-any-file:
    - '**/*.md'
    - 'docs/**'

'area:docker':
- changed-files:
  - any-glob-to-any-file:
    - 'docker-compose*.yml'
    - 'Dockerfile*'

# Applied only when ALL changed files are documentation — no code touched
'docs-only':
- changed-files:
  - any-glob-to-all-files:
    - '**/*.md'
    - '**/*.rst'
    - 'docs/**'
    - '.github/*.md'
    - 'LICENSE'
    - 'CHANGELOG*'
