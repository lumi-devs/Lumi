name: PR Size Label

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Label PR by size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply size label
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const additions = pr.additions ?? 0;
            const deletions = pr.deletions ?? 0;
            const total = additions + deletions;

            let sizeLabel;
            if (total < 50)       sizeLabel = 'size:S';
            else if (total < 200) sizeLabel = 'size:M';
            else if (total < 500) sizeLabel = 'size:L';
            else                  sizeLabel = 'size:XL';

            // Remove any existing size labels
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const sizeLabels = labels
              .map(l => l.name)
              .filter(n => n.startsWith('size:'));

            for (const label of sizeLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: label,
              });
            }

            // Add the correct size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sizeLabel],
            });

            core.info(`PR has ${total} changed lines → applied label: ${sizeLabel}`);
