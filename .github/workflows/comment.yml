name: Comment Reaction

on:
  issue_comment:
    types: [created]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  react:
    name: React with eyes on PR bot commands
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && (contains(github.event.comment.body, '/lumi') || contains(github.event.comment.body, '@lumi-devs'))
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });
