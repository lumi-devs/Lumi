name: PR Summary Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  summary-comment:
    name: Post Sticky PR Overview Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Post or Update Sticky PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lumi-pr-summary
          message: |
            ## Ecosystem & CI Matrix

            | Subsystem | Status | Scope |
            | :--- | :---: | :--- |
            | `packages/core` | 🟢 Ready | Engine & Perms |
            | `apps/gateway` | 🟢 Ready | Shard Router |
            | `apps/worker` | 🟢 Ready | Task Execution |

            <details>
            <summary><b>Workspace Pipelines</b></summary>

            - `bun run typecheck:all`
            - `bun run lint:all`
            - `bun run test`
            </details>

            *commit `${{ github.event.pull_request.head.sha }}`*
