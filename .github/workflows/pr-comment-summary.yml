name: PR Summary Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  summary-comment:
    name: Post Sticky PR Overview Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Post or Update Sticky PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lumi-pr-summary
          message: |
            ### Monorepo Build Matrix

            | Subsystem | Scope | Workflow Target |
            | :--- | :--- | :--- |
            | `packages/` | Workspace Core | `bun run check:all` |
            | `apps/` | Distributed Services | `docker.yml` |
            | `.changeset/` | Versioning Gate | `release.yml` |

            *Automated CI report for PR #${{ github.event.pull_request.number }} (`${{ github.event.pull_request.head.sha }}`).*
