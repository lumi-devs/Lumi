name: PR Summary Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  summary-comment:
    name: Post Micro-Benchmark PR Report
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Micro-Benchmark Suite
        id: bench
        run: |
          BENCH_RESULTS=$(bun run bench)
          echo "BENCH_RESULTS<<EOF" >> $GITHUB_ENV
          echo "$BENCH_RESULTS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post or Update Sticky Micro-Benchmark Report
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lumi-pr-summary
          message: |
            ## Micro-Benchmark Results

            ${{ env.BENCH_RESULTS }}

            ---
            *Commit `${{ github.event.pull_request.head.sha }}`*
