name: Docker Packaging & Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Docker Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
              - 'apps/**'
              - '!apps/**/*.md'
              - 'packages/**'
              - '!packages/**/*.md'
              - 'prisma/**'
              - '.github/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.github/workflows/docker.yml'

  build-and-push:
    name: Build & Push (${{ matrix.target.name }})
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: worker
          - name: api
          - name: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase repository image name
        id: image_meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.target.name }}" = "dashboard" ]; then
            echo "image=ghcr.io/${REPO_LOWER}-dashboard" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.target.name }}" = "api" ]; then
            echo "image=ghcr.io/${REPO_LOWER}-api" >> $GITHUB_OUTPUT
          else
            echo "image=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image_meta.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build image (push on non-PR, local load on PR)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target.name }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || false }}

      - name: Determine image reference to scan
        id: scan_ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          else
            REF="${{ steps.image_meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.scan_ref.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy scan results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.target.name }}

      - name: Fail build on Trivy findings
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL or fixable HIGH vulnerabilities in ${{ matrix.target.name }} image." >&2
          exit 1

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4

      - name: Sign pushed image with cosign (keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${{ steps.image_meta.outputs.image }}@${{ steps.build.outputs.digest }}"
