name: Label Sync

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labelsync.yml'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  labelsync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: false
