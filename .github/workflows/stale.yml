name: Mark Stale Issues & Pull Requests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # Stale labels only — never auto-closes. days-before-close: -1 disables closing.
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: -1
          stale-issue-message: 'This issue has been automatically marked as stale due to inactivity. Comment or remove the `stale` label to keep it open.'
          stale-pr-message: 'This pull request has been automatically marked as stale due to inactivity. Comment or remove the `stale` label to keep it open.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,no-stale,blocked'
          exempt-pr-labels: 'pinned,security,no-stale,blocked'
          exempt-draft-pr: true
