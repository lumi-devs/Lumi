name: Publish Packages

on:
  push:
    tags:
      - "contracts-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish @lumi-devs/contracts + @lumi-devs/observability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#contracts-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: packages/contracts
        run: bun run build

      - name: Build observability
        working-directory: packages/observability
        run: bun run build

      - name: Publish contracts
        working-directory: packages/contracts
        run: |
          npm pkg set name=@lumi-devs/contracts
          npm pkg set version=${{ steps.version.outputs.version }}
          npm publish --access public --tag ${{ steps.version.outputs.dist_tag }}

      - name: Publish observability
        working-directory: packages/observability
        run: |
          npm pkg set name=@lumi-devs/observability
          npm pkg set version=${{ steps.version.outputs.version }}
          npm publish --access public --tag ${{ steps.version.outputs.dist_tag }}
