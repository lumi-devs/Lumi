name: Welcome First-Time Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome first-time contributor
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            👋 Hey there, thanks for opening your first issue on **Lumi**!

            A maintainer will review it as soon as possible. In the meantime:
            - Please make sure you've filled out the issue template fully.
            - Search existing issues to avoid duplicates.

            We appreciate you taking the time to report! 🚀
          pr_message: |
            👋 Thanks for opening your first pull request on **Lumi** — we're glad you're here!

            A maintainer will review it shortly. While you wait:
            - Make sure CI is green (lint, typecheck, tests all pass).
            - Check that your branch is up to date with `main` or `develop`.
            - Add or update tests for any code you've changed.

            Welcome to the project! 🎉
