name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    name: Apply triage label to new issues
    runs-on: ubuntu-latest
    steps:
      - name: "Apply Status: Needs Triage"
        uses: actions/github-script@v9
        with:
          script: |
            const hasStatusLabel = context.payload.issue.labels
              .some(l => l.name.startsWith('Status: '));

            if (hasStatusLabel) {
              core.info('Issue already has a Status label — skipping.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['Status: Needs Triage'],
            });

            core.info('Applied "Status: Needs Triage" to issue #' + context.issue.number);
