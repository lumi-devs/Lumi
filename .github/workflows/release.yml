name: Release & Versioning

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version-or-release:
    name: Manage Version PR & GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Create Version PR or Create Release Notes
        uses: changesets/action@v1
        with:
          version: bun run version:sync
          commit: "chore: version packages and sync module manifests"
          title: "chore: version packages and sync module manifests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
