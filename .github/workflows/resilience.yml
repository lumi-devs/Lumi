name: Resilience & Fault Tolerance Verification

# Runs the distributed resilience & fault-tolerance verification suite against ephemeral infrastructure.
# `bun run verify:resilience` tests message delivery, ordering, ACK removal, and burst concurrency.
on:
  push:
    branches: [main]
    paths:
      - 'packages/event-bus/**'
      - 'scripts/verify-resilience.ts'
      - '.github/workflows/resilience.yml'
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  workflow_dispatch:

jobs:
  resilience:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run db:generate

      - name: verify:resilience (Redis suite)
        run: bun run verify:resilience
