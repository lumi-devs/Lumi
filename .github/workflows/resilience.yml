name: Resilience & Fault Tolerance Verification

# Runs the distributed resilience & fault-tolerance verification suite against ephemeral infrastructure.
# `bun run verify:resilience` tests message delivery, ordering, ACK removal, burst concurrency, and multi-transport recovery.
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  workflow_dispatch:

jobs:
  resilience:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bun run db:generate

      - name: Start NATS (JetStream)
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8222/healthz >/dev/null; then echo "NATS ready"; exit 0; fi
            sleep 1
          done
          echo "NATS did not become ready in time" >&2
          docker logs nats || true
          exit 1

      - name: verify:resilience (Redis + NATS suite)
        run: bun run verify:resilience

      - name: NATS logs (on failure)
        if: failure()
        run: docker logs nats || true
