name: Lock Inactive Threads

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  lock:
    name: Lock Inactive Closed Issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: dessant/lock-threads@v5
        with:
          issue-inactive-days: '60'
          pr-inactive-days: '60'
          process-only: 'issues, prs'
          issue-comment: 'This thread has been automatically locked since there has not been any recent activity after it was closed. Please open a new issue for related bugs.'
          pr-comment: 'This pull request has been automatically locked since there has not been any recent activity after it was closed. Please open a new issue for related bugs.'
