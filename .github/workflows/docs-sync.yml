name: Docs Sync

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "scripts/docs/**"
      - "packages/contracts/src/**"
      - "packages/core/src/lib/env.ts"
      - "packages/core/src/lib/database/redis.ts"
      - "packages/core/src/lib/permissions/PermitResolver.ts"
      - "packages/core/src/lib/client/client-options.ts"
      - "packages/core/src/lib/client/scheduled-tasks-queue.ts"
      - "packages/core/src/lib/addon-sandbox/sdk/**"
      - "packages/core/src/modules/*/manifest.json"
      - "packages/core/src/modules/*/commands/**"
      - "apps/api/src/rpc-http-server.ts"
      - "prisma.config.ts"
      - "package.json"
  workflow_dispatch: {}

permissions: {}

jobs:
  dispatch:
    name: Notify lumi-devs/Lumi-docs
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_DISPATCH_TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set on this repo, so no repository_dispatch was sent to lumi-devs/Lumi-docs. Its daily scheduled build still picks up this change within 24h; set the secret (a fine-grained PAT with Actions + Contents write on Lumi-docs) for an immediate rebuild instead."
            exit 0
          fi
          status=$(curl -s -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lumi-devs/Lumi-docs/dispatches \
            -d '{"event_type":"lumi-docs-sync"}')
          if [ "$status" != "204" ]; then
            echo "::error::repository_dispatch to lumi-devs/Lumi-docs failed with HTTP $status"
            cat /tmp/dispatch-response.txt
            exit 1
          fi
          echo "Dispatched lumi-docs-sync to lumi-devs/Lumi-docs"
