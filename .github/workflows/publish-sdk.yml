name: Publish SDK Types

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  packages: write
  contents: read

jobs:
  publish:
    name: Publish @lumi-devs/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # GitHub Packages needs a .npmrc pointing at npm.pkg.github.com with the
      # job token as the bearer credential; `npm publish` reads it from here,
      # not from the registry URL alone.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lumi-devs"

      - run: bun install --frozen-lockfile

      - name: Build SDK type declarations
        run: bun run sdk:build

      - name: Publish @lumi-devs/sdk
        working-directory: dist/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The build script already writes name "@lumi-devs/sdk"; only the
          # version is stamped from the tag, same as publish-packages.yml.
          npm pkg set version=${{ steps.version.outputs.version }}
          npm publish --tag ${{ steps.version.outputs.dist_tag }}
