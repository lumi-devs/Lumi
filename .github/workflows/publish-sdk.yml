name: Publish SDK Types

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish @lumi-devs/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Build SDK type declarations
        run: bun run sdk:build

      - name: Publish @lumi-devs/sdk
        working-directory: dist/sdk
        run: |
          npm pkg set version=${{ steps.version.outputs.version }}
          npm publish --access public --tag ${{ steps.version.outputs.dist_tag }}
