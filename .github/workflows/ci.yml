name: CI Pipeline

on:
  push:
    branches: [main, develop, "release/*"]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'turbo.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'turbo.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: CI / typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run Typecheck
        run: bun run typecheck

  lint:
    name: CI / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run Linter
        run: bun run lint

  test:
    name: CI / test (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["latest"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run Unit & Integration Tests
        run: bun run test
