name: CI

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      nix: ${{ steps.filter.outputs.nix }}
      addons: ${{ steps.filter.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'prisma/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - 'turbo.json'
            nix:
              - 'flake.nix'
              - 'flake.lock'
            addons:
              - 'examples/**'
              - 'scripts/validate-addon.ts'
              - 'packages/core/src/lib/downloader/**'

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: echo "::add-matcher::.github/problemMatchers/eslint.json"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - name: Turbo Filtered Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun turbo run lint:all --filter=[origin/${{ github.base_ref }}...HEAD] || bun run lint
          else
            bun run lint
          fi

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: echo "::add-matcher::.github/problemMatchers/tsc.json"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - name: Turbo Filtered Typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun turbo run typecheck:all --filter=[origin/${{ github.base_ref }}...HEAD] || bun run typecheck
          else
            bun run typecheck
          fi

  test:
    name: Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/dashboard/lcov.info
          retention-days: 1
          if-no-files-found: error
      - name: Codecov Upload
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage/dashboard/lcov.info
          fail_ci_if_error: false

  validate-examples:
    name: Validate Example Addons
    needs: changes
    if: ${{ needs.changes.outputs.addons == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Validate example addons against the Downloader's structural rules
        run: bun run validate examples

  nix-check:
    name: Nix Flake Evaluation
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Verify Nix Flake Output
        run: nix flake check --extra-experimental-features "nix-command flakes"
