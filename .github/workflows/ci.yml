name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      # Type-aware ESLint (parserOptions.project) resolves the TS program, which
      # path-maps @prisma/client to ./prisma/generated/client — generate it first
      # or a fresh checkout fails to resolve every Prisma import.
      - run: bun run db:generate
      # Read-only measure: the `bun run lint` script is `eslint --fix` (mutates +
      # would auto-fix-then-pass in CI, gating nothing). Use the bare form here.
      - run: bunx eslint packages/*/src apps/*/src

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      # typecheck path-maps @prisma/client to the generated client; without this
      # a fresh checkout errors with missing Prisma exports (User, Prisma, …).
      - run: bun run db:generate
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      # Prisma client is referenced (type-only) across the tree; generate it so a
      # fresh CI checkout can transform every import without a generated-client miss.
      - run: bun run db:generate
      # Canonical runner is vitest (`bun run test`); `bun test` (Bun native) ignores vi.mock.
      - run: bun run test
