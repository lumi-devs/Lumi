name: 💡 Feature Request
description: Propose a new feature, enhancement, or architectural improvement
title: "[Feat]: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a feature or framework improvement? Fill out the form below to propose it!
  - type: dropdown
    id: scope
    attributes:
      label: Target Scope / Subsystem
      description: Where should this feature be implemented?
      options:
        - "@lumi/core (Framework Core & Base Engine)"
        - "New Core Module (packages/core/src/modules/)"
        - "@lumi/worker (Gateway Connection & Command Engine, worker role)"
        - "@lumi/worker (Scheduled Tasks Engine, scheduler role)"
        - "@lumi/dashboard (Web Management UI)"
        - "@lumi/event-bus (Event Streaming Infrastructure)"
        - "@lumi/sharding (Sharding Coordinator)"
        - "CLI / Developer Tools"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Describe the problem, limitation, or use case that motivates this feature request.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Clear and detailed description of the proposed feature or capability.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any mockups, visual examples, API designs, or reference links.
