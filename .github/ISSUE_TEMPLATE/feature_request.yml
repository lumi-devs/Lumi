name: 💡 Feature Request
description: Suggest an idea or new capability for the framework
title: "[Feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a feature or enhancement? Fill out the form below!
  - type: dropdown
    id: scope
    attributes:
      label: Target Scope / Subsystem
      description: Where should this feature live?
      options:
        - "@lumi/core (Framework Core & Base Engine)"
        - "New Core Module (packages/core/src/modules/)"
        - "@lumi/gateway (WebSocket Shard Gateway)"
        - "@lumi/worker (Background Packet Consumer)"
        - "@lumi/scheduler (Scheduled Tasks Engine)"
        - "@lumi/dashboard (Web Management UI)"
        - "@lumi/event-bus (Event Streaming Infrastructure)"
        - "@lumi/sharding (Sharding Coordinator)"
        - "CLI / Developer Tools"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear description of what the problem or limitation is (e.g. "I'm frustrated when...")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any mockups, API design ideas, or related issues here.
