name: 🐛 Bug Report
description: Create a structured bug report to help us reproduce and fix an issue
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below with as much detail as possible.
  - type: dropdown
    id: package
    attributes:
      label: Affected Package / Module
      description: Select the primary package or application where the bug occurs
      options:
        - "@lumi/core (Bot Core & Modules)"
        - "@lumi/gateway (Discord Gateway Service)"
        - "@lumi/worker (Event Worker Engine)"
        - "@lumi/scheduler (BullMQ Scheduler Engine)"
        - "@lumi/dashboard (Web Dashboard)"
        - "@lumi/event-bus (Event Bus / Redis / NATS)"
        - "@lumi/sharding (Sharding Coordinator)"
        - "@lumi/contracts / @lumi/sdk"
        - "Other / Unknown"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. Publish event '...'
        3. See error in log...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Stack Trace or Logs
      description: Please copy and paste any relevant terminal output or log snippets here.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Bun version, Database versions
      placeholder: Linux (Ubuntu 24.04), Bun 1.3.14, Redis 7.4, Postgres 17
    validations:
      required: true
