name: 🐛 Bug Report
description: Create a structured bug report to help us reproduce and resolve an issue
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report! Please provide as much detail as possible so we can reproduce and resolve the issue quickly.
  - type: dropdown
    id: package
    attributes:
      label: Affected Package / Subsystem
      description: Select the primary package or service where the issue occurs
      options:
        - "@lumi/core (Framework Core & Base Modules)"
        - "@lumi/worker (Gateway Connection & Command Engine, worker role)"
        - "@lumi/worker (BullMQ Task Engine, scheduler role)"
        - "@lumi/dashboard (Web Dashboard)"
        - "@lumi/event-bus (Redis Streams Event Infrastructure)"
        - "@lumi/sharding (Sharding Coordinator)"
        - "@lumi/contracts / @lumi/sdk"
        - "Other / Unknown"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. Publish event '...'
        3. See error log...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Stack Traces
      description: Please paste any relevant console logs, stack traces, or error output.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: OS version, Bun version, Node version, Redis/Postgres version
      placeholder: Linux (Ubuntu 24.04 LTS), Bun 1.3.14, Node 22.x, PostgreSQL 17
    validations:
      required: true
