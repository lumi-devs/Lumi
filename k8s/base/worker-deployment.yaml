apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumi-worker
  namespace: lumi
  labels:
    app: lumi-worker
    component: fleet-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumi-worker
  template:
    metadata:
      labels:
        app: lumi-worker
        component: fleet-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: lumi-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: lumibot/lumi-v2:latest
          imagePullPolicy: Always
          command: ["bun", "apps/worker/dist/index.js"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lumi-secrets
                  key: discord-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumi-secrets
                  key: database-url
            - name: REDIS_HOST
              value: "lumi-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumi-secrets
                  key: redis-password
            - name: MANAGER_URL
              value: "http://lumi-manager:8080"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SHARD_IDS
              value: "0,1,2,3,4"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - lumi-worker
                topologyKey: kubernetes.io/hostname