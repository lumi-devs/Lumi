apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumi-manager
  namespace: lumi
  labels:
    app: lumi-manager
    component: fleet-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumi-manager
  template:
    metadata:
      labels:
        app: lumi-manager
        component: fleet-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: lumi-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: manager
          image: lumibot/lumi-v2:latest
          imagePullPolicy: Always
          command: ["bun", "apps/manager/dist/index.js"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumi-secrets
                  key: database-url
            - name: REDIS_HOST
              value: "lumi-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumi-secrets
                  key: redis-password
            - name: MANAGER_PORT
              value: "8080"
            - name: TOTAL_SHARDS
              value: "10"
            - name: SHARDS_PER_WORKER
              value: "5"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5