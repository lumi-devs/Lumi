apiVersion: v1
kind: Service
metadata:
  name: lumi-bot
  namespace: lumi
  labels:
    app: lumi-bot
spec:
  selector:
    app: lumi-bot
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 8082
      targetPort: 8082
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: lumi-redis
  namespace: lumi
  labels:
    app: lumi-redis
spec:
  selector:
    app: lumi-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: lumi-postgres
  namespace: lumi
  labels:
    app: lumi-postgres
spec:
  selector:
    app: lumi-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP