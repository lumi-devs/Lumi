# 3-node cluster config shared by rabbitmq, rabbitmq-2, rabbitmq-3 under the
# `ha` profile. classic_config peer discovery is the simplest stable form for
# a static cluster on docker compose — every node knows the full set up front.
deprecated_features.permit.management_metrics_collection = true

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# If a node loses contact and reboots before the partition heals, automatically
# rejoin and discard local state newer than the cluster's — best for queues we
# treat as transient (events fanout, RPC).
cluster_partition_handling = autoheal
