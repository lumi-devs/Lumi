# Primary tuning for streaming replication (mounted onto postgres-primary).
# Loaded via `-c config_file=...` on the command line.
listen_addresses = '*'
max_connections = 200

wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 512MB
hot_standby = on

# pg_basebackup needs this to copy data even while writes happen.
wal_log_hints = on

# Modest memory footprint to match the existing 256m limit; tune per host.
shared_buffers = 64MB
effective_cache_size = 192MB
