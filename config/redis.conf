# Redis 8 Configuration for Lumi v2
# Key Redis 8 features enabled:

# Redis 8 includes Redis Stack modules built-in:
# - RediSearch (vector similarity search, full-text search)
# - RedisJSON (JSON document support)
# - RedisTimeSeries (time-series data)
# - RedisBloom (probabilistic data structures)

# Network
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Redis 8: Hash field expiration (TTL per hash field)
# HSET key field value EX 3600

# Redis 8: Client-side caching support
# Enable tracking for client-side caching
# CLIENT CACHING YES

# Redis 8: Vector similarity search (RediSearch)
# FT.CREATE idx ON JSON PREFIX 1 doc: SCHEMA $.title AS title TEXT $.embedding AS embedding VECTOR FLAT 6 TYPE FLOAT32 DIM 384 DISTANCE_METRIC COSINE

# Redis 8: Enhanced ACL - SORT access patterns
# USER foo (+sort ~* ~mylist) allows SORT on mylist

# Lua scripting
lua-time-limit 5000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# TLS (if needed)
# tls-port 6380
# tls-cert-file /etc/redis/tls/redis.crt
# tls-key-file /etc/redis/tls/redis.key
# tls-ca-cert-file /etc/redis/tls/ca.crt

# Security
# requirepass yourpassword
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""

# Logging
loglevel notice
logfile ""

# Databases
databases 16

# Active defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 75

requirepass R9jMbynvud4c3Btoix0HjvaY
