groups:
  - name: lumi-slo
    rules:
      - alert: ShardDown
        expr: min(lumi_shard_status) by (service) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Discord shard down on {{ $labels.service }}"
          description: "At least one shard has reported status 0 for over a minute."

      - alert: QueueLagGrowing
        expr: max(lumi_queue_depth) by (service, queue) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} backing up on {{ $labels.service }}"
          description: "Queue depth has exceeded 1000 for 5 minutes — consumers are falling behind."

      - alert: Rest429Spike
        expr: sum(rate(lumi_rest_429_total[5m])) by (service) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Discord REST 429s on {{ $labels.service }}"
          description: "Sustained rate-limit responses (>1/s over 5m) — risk of a global ban."

      - alert: DbPoolSaturation
        expr: |
          max(lumi_pg_pool_waiting) by (service) > 0
          or
          (max(lumi_pg_pool_used) by (service) / max(lumi_pg_pool_size) by (service)) > 0.9
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "DB pool near saturation on {{ $labels.service }}"
          description: "Postgres pool is >90% used or has waiters for 3 minutes."

      - alert: StreamConsumerLag
        expr: max(lumi_stream_consumer_lag) by (stream, group) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.group }} lagging on {{ $labels.stream }}"
          description: "Pending (unacked) entries have exceeded 1000 for 5 minutes — consumers are not keeping up."

      - alert: StreamDlqGrowing
        expr: max(lumi_stream_dlq_length) by (stream) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "DLQ has entries on {{ $labels.stream }}"
          description: "Stream {{ $labels.stream }}:dlq is non-empty — a message exceeded max-deliveries and was parked. Inspect with XRANGE."

      # Discord IP-bans the bot at 10k invalid (401/403/429) responses in
      # a 10-minute window. invalidRequestWarningInterval=500 → each emit is
      # 500 invalid responses; 1/min sustained projects to 30k/10min = ban
      # territory. Fire at 0.1/s (= 60/min in emits → 30k invalid/10min), well
      # below the ban threshold.
      - alert: RestInvalidRequestSurge
        expr: sum(rate(lumi_rest_invalid_request_warnings_total[5m])) by (service) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Invalid REST request surge on {{ $labels.service }}"
          description: "401/403/429 rate is on track for the 10k/10min CloudFlare ban. Check `lumi_rest_429_total` and `lumi_rest_retry_after_seconds` by route."

      - alert: CommandErrorRate
        expr: |
          sum(rate(lumi_commands_total{status="error"}[5m])) by (service)
          /
          clamp_min(sum(rate(lumi_commands_total[5m])) by (service), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Command error rate >5% on {{ $labels.service }}"
          description: "More than 5% of commands have errored over the last 5 minutes."

      # V8 heap headroom. `nodejs_heap_size_limit_bytes` is the
      # --max-old-space-size cap; sustained >85% means GC pauses dominate and
      # the next allocation spike will OOM. Bump the budget or shed load.
      - alert: NodeHeapPressure
        expr: |
          max(lumi_nodejs_heap_size_used_bytes) by (service)
          /
          clamp_min(max(lumi_nodejs_heap_size_limit_bytes) by (service), 1) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "V8 heap >85% on {{ $labels.service }}"
          description: "Heap pressure sustained. Either the service has a leak or the NODE_OPTIONS=--max-old-space-size cap is too small for the workload."
