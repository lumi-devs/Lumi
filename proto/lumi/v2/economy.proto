syntax = "proto3";

package lumi.v2;

option go_package = "github.com/lumi/lumi-v2/proto/lumi/v2";

service EconomyService {
  rpc GetBalance(GetBalanceRequest) returns (BalanceResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
  rpc GetShop(GetShopRequest) returns (ShopResponse);
  rpc BuyItem(BuyItemRequest) returns (BuyItemResponse);
  rpc GenerateBalanceCard(GenerateBalanceCardRequest) returns (BalanceCardResponse);
  rpc GetLeaderboard(GetEconomyLeaderboardRequest) returns (EconomyLeaderboardResponse);
}

message GetBalanceRequest {
  string guild_id = 1;
  string user_id = 2;
}

message BalanceResponse {
  string balance = 1;
  string bank_balance = 2;
  string total_earned = 3;
  string total_spent = 4;
}

message TransferRequest {
  string guild_id = 1;
  string from_user_id = 2;
  string to_user_id = 3;
  string amount = 4;
}

message TransferResponse {
  bool success = 1;
  string tax = 2;
  string error = 3;
}

message GetShopRequest {
  string guild_id = 1;
}

message ShopResponse {
  repeated ShopItem items = 1;
}

message ShopItem {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 price = 4;
  string type = 5;
  string role_id = 6;
}

message BuyItemRequest {
  string guild_id = 1;
  string user_id = 2;
  string item_id = 3;
}

message BuyItemResponse {
  bool success = 1;
  string error = 2;
}

message GenerateBalanceCardRequest {
  string guild_id = 1;
  string user_id = 2;
}

message BalanceCardResponse {
  bytes image = 1;
}

message GetEconomyLeaderboardRequest {
  string guild_id = 1;
  int32 page = 2;
  int32 per_page = 3;
}

message EconomyLeaderboardResponse {
  repeated EconomyLeaderboardEntry users = 1;
  int32 total = 2;
  int32 total_pages = 3;
}

message EconomyLeaderboardEntry {
  string user_id = 1;
  string balance = 2;
  string bank_balance = 3;
  int32 rank = 4;
}