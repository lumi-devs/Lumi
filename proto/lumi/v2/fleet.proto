syntax = "proto3";

package lumi.v2;

option go_package = "github.com/lumi/lumi-v2/proto/lumi/v2";

service FleetService {
  rpc GetFleetStatus(GetFleetStatusRequest) returns (FleetStatus);
  rpc GetShardAssignment(GetShardAssignmentRequest) returns (ShardAssignment);
  rpc RebalanceShards(RebalanceShardsRequest) returns (RebalanceShardsResponse);
  rpc GetNodeHealth(GetNodeHealthRequest) returns (NodeHealth);
  rpc TriggerRollingRestart(TriggerRollingRestartRequest) returns (RollingRestartStatus);
}

message GetFleetStatusRequest {}

message FleetStatus {
  repeated NodeInfo nodes = 1;
  int32 total_shards = 2;
  int32 online_shards = 4;
  string status = 5;
}

message NodeInfo {
  string node_id = 1;
  int32 shard_start = 2;
  int32 shard_end = 3;
  bool healthy = 4;
  int64 last_heartbeat = 5;
  int32 guilds = 6;
  int32 users = 7;
}

message GetShardAssignmentRequest {
  string guild_id = 1;
}

message ShardAssignment {
  int32 shard_id = 1;
  string node_id = 2;
}

message RebalanceShardsRequest {}

message RebalanceShardsResponse {
  bool success = 1;
  repeated ShardMove moves = 2;
}

message ShardMove {
  int32 shard_id = 1;
  string from_node = 2;
  string to_node = 3;
}

message GetNodeHealthRequest {
  string node_id = 1;
}

message NodeHealth {
  string node_id = 1;
  bool healthy = 2;
  double cpu_usage = 3;
  int64 memory_usage = 4;
  int64 uptime = 5;
  int32 active_shards = 6;
}

message TriggerRollingRestartRequest {
  int32 batch_size = 1;
  int32 delay_seconds = 2;
}

message RollingRestartStatus {
  bool started = 1;
  int32 total_nodes = 2;
  int32 completed = 3;
}