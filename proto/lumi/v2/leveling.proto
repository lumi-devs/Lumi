syntax = "proto3";

package lumi.v2;

option go_package = "github.com/lumi/lumi-v2/proto/lumi/v2";

service LevelingService {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (LeaderboardResponse);
  rpc GetUserRank(GetUserRankRequest) returns (UserRankResponse);
  rpc GenerateRankCard(GenerateRankCardRequest) returns (RankCardResponse);
  rpc SetXpCurve(SetXpCurveRequest) returns (SetXpCurveResponse);
}

message GetLeaderboardRequest {
  string guild_id = 1;
  int32 page = 2;
  int32 per_page = 3;
}

message LeaderboardResponse {
  repeated LeaderboardEntry users = 1;
  int32 total = 2;
  int32 total_pages = 3;
}

message LeaderboardEntry {
  string user_id = 1;
  int32 level = 2;
  int64 xp = 3;
  int32 rank = 4;
}

message GetUserRankRequest {
  string guild_id = 1;
  string user_id = 2;
}

message UserRankResponse {
  int32 level = 1;
  int64 xp = 2;
  int64 xp_to_next = 3;
  int32 rank = 4;
  int32 total_users = 5;
}

message GenerateRankCardRequest {
  string guild_id = 1;
  string user_id = 2;
}

message RankCardResponse {
  bytes image = 1;
}

message SetXpCurveRequest {
  string guild_id = 1;
  map<string, int32> curve = 2;
}

message SetXpCurveResponse {
  bool success = 1;
}